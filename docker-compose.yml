version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: triage_db
      MYSQL_USER: triage_user
      MYSQL_PASSWORD: triage_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
      timeout: 5s

  redis:
    image: redis:7.2
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://triage_user:triage_password@db:3306/triage_db
      DB_HOST: db
      DB_PORT: 3306
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env:ro
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

networks:
  default:
    driver: bridge
